name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to verify and release
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Verify tag matches package version
        run: |
          release_version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$release_version" = "$package_version"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Verify release candidate
        run: |
          npm run build
          npm test
          npm run test:pi-commands
          npm run typecheck
          npm run privacy:check
      - name: Build release artifact
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-laya-package
          path: artifacts/*.tgz
          if-no-files-found: error

  github-release:
    needs: verify-release
    if: needs.verify-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: pi-laya-package
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" artifacts/*.tgz --verify-tag --generate-notes
